name: Android

# 触发策略：
#   * 任意分支 push / PR → 只建 debug APK，破了马上知道
#   * 推 tag vX.Y.Z      → 建签名 release APK 并自动创建 GitHub Release
#   * 手动 workflow_dispatch 便于重跑
#
# 首次上线：2026-10-11（区块 1 收尾）
# 注意：release 作业依赖 4 个 Secrets，未配置时会主动失败——这是故意的：
#       宁可失败，也不发出一个装不上的未签名包。见 docs/BUILD.md §3。
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # 创建 Release 需要

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  # 本仓库不提交 gradle-wrapper.jar，由 CI 安装指定版本的 Gradle
  GRADLE_VERSION: "8.13"

jobs:
  debug:
    name: Debug APK
    # tag 构建走下面的 release 作业
    if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: 安装 Android SDK
        uses: android-actions/setup-android@v3

      - name: 安装 Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: 打印版本信息
        run: gradle :app:versionInfo -q

      - name: 构建 debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

  release:
    name: Release APK
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: 安装 Android SDK
        uses: android-actions/setup-android@v3

      - name: 安装 Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      # —— 版本号：tag 覆盖 versionName，versionCode 仍以 version.properties 为准 ——
      - name: 校验 tag 与 version.properties 一致
        run: |
          tag="${GITHUB_REF_NAME#v}"
          file=$(grep -E '^versionName=' version.properties | cut -d= -f2 | tr -d ' \r')
          echo "tag=$tag  version.properties:versionName=$file"
          if [ "$tag" != "$file" ]; then
            echo "::error::tag v$tag 与 version.properties 的 versionName=$file 不一致；请先 bump 版本号再打 tag"
            exit 1
          fi
          echo "VERSION_NAME=$tag" >> "$GITHUB_ENV"

      # —— 签名：缺少 Secrets 就拒绝发布（绝不发出装不上的包）——
      - name: 准备签名 keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::缺少 ANDROID_KEYSTORE_BASE64 等 Secrets，拒绝发布未签名包（见 docs/BUILD.md §3）"
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: 构建 release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle :app:assembleRelease --stacktrace

      - name: 重命名并生成 SHA-256
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk out/app-release.apk
          cd out
          sha256sum app-release.apk | tee app-release.apk.sha256
          ls -lh

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: out/*
          retention-days: 90

      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            out/app-release.apk
            out/app-release.apk.sha256
          generate_release_notes: true
          draft: false
