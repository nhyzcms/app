# 临时通道（区块 6）：把 .github/parts/chunk06-*.patch 应用到两个大文件并提交。
#
# 为什么存在：仓库写入通道（MCP）单次载荷约 1 万字符，而
#   app/src/main/java/com/nhyzcms/clubapp/shell/feel/FeelHost.kt  约 24.8k 字符
#   app/src/main/java/com/nhyzcms/clubapp/MainActivity.kt          约 30.0k 字符
# 超出上限，因此拆成 6 个补丁，由本工作流应用并用 sha256 校验后提交。
#
# ⚠️ 本文件与 .github/parts/ 都是**临时**的：区块 6 合并后由维护者删除。
# 幂等：补丁已应用时跳过；分片被清理后整个作业直接跳过。
#
# 踩过的坑：一开始把 `hashFiles()` 写在作业级 `if` 里 —— 作业级 if 在 checkout
# 之前求值，工作区是空的，hashFiles 返回空串 → 作业被静默 skipped（什么都不发生）。
# 改成 checkout 之后在步骤里判。
name: temp-assemble-chunk06

on:
  push:
    paths:
      - '.github/parts/**'
      - '.github/workflows/temp-assemble-chunk06.yml'

permissions:
  contents: write
  issues: write

jobs:
  assemble:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: 检查分片是否存在
        id: parts
        shell: bash
        run: |
          if [ -f .github/parts/chunk06-01.patch ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "分片已清理，跳过"
          fi

      - name: Apply patches
        if: steps.parts.outputs.present == 'true'
        shell: bash
        run: |
          set -uo pipefail
          exec > >(tee /tmp/assemble.log) 2>&1
          for p in 01 02 03 04 05 06; do
            patch_file=".github/parts/chunk06-$p.patch"
            echo "::group::apply $patch_file"
            if git apply --check "$patch_file" 2>/dev/null; then
              git apply "$patch_file" && echo "applied $patch_file"
            elif git apply --reverse --check "$patch_file" 2>/dev/null; then
              echo "$patch_file 已经应用过，跳过（幂等）"
            else
              echo "$patch_file 无法应用（目标文件与预期不一致）"
              exit 1
            fi
            echo "::endgroup::"
          done

      - name: Verify sha256
        if: steps.parts.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          echo "387ae70409e999c8fe53df10ca760c74a6224bf9b2501671a7522c3b969bc937  app/src/main/java/com/nhyzcms/clubapp/shell/feel/FeelHost.kt" | sha256sum -c -
          echo "d1f82fb987d953e6c9ef3af68b82ca75e9121409f492a9a0d7802de6d0980b6a  app/src/main/java/com/nhyzcms/clubapp/MainActivity.kt" | sha256sum -c -

      - name: Commit and push
        if: steps.parts.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "没有变化，无需提交"
            exit 0
          fi
          git config user.name "nhyzcms-assemble-bot"
          git config user.email "noreply@github.com"
          git add app/src/main/java/com/nhyzcms/clubapp/MainActivity.kt app/src/main/java/com/nhyzcms/clubapp/shell/feel/FeelHost.kt
          git commit -m "feat(区块 6)：首屏看护去误报 + 探测降频 + 大资源拦截接线（由分片补丁合并生成）"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Report failure as issue
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tail -c 2500 /tmp/assemble.log > /tmp/tail.txt 2>/dev/null || true
          gh issue create \
            --title "[区块6] 临时分片合并失败（需人工介入）" \
            --body "$(cat /tmp/tail.txt 2>/dev/null)" || true
