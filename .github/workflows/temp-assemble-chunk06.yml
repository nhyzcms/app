# 临时通道（区块 6，第二轮）：应用修复补丁到 FeelHost.kt 并提交。
#
# 背景：仓库写入通道（MCP）单次载荷约 1 万字符，而 FeelHost.kt 约 24.8k 字符，
# 无法整文件推送，故用补丁 + 一次性工作流（应用后用 sha256 校验）。
#
# ⚠️ 本文件与 .github/parts/ 都是**临时**的：修复合并后由维护者删除。
name: temp-assemble-chunk06

on:
  push:
    paths:
      - '.github/parts/**'
      - '.github/workflows/temp-assemble-chunk06.yml'

permissions:
  contents: write
  issues: write

jobs:
  assemble:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: 检查补丁是否存在
        id: parts
        shell: bash
        run: |
          if [ -f .github/parts/chunk06-fix1.patch ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "补丁已清理，跳过"
          fi

      - name: Apply patches
        if: steps.parts.outputs.present == 'true'
        shell: bash
        run: |
          set -uo pipefail
          exec > >(tee /tmp/assemble.log) 2>&1
          for p in fix1; do
            patch_file=".github/parts/chunk06-$p.patch"
            echo "::group::apply $patch_file"
            if git apply --check "$patch_file" 2>/dev/null; then
              git apply "$patch_file" && echo "applied $patch_file"
            elif git apply --reverse --check "$patch_file" 2>/dev/null; then
              echo "$patch_file 已经应用过，跳过（幂等）"
            else
              echo "$patch_file 无法应用（目标文件与预期不一致）"
              exit 1
            fi
            echo "::endgroup::"
          done

      - name: Verify sha256
        if: steps.parts.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          echo "a79ef212d95cc6a68dd761cb5ccadb0f27cb62245483b9a7bd70fbcf256f0fd3  app/src/main/java/com/nhyzcms/clubapp/shell/feel/FeelHost.kt" | sha256sum -c -

      - name: Commit and push
        if: steps.parts.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "没有变化，无需提交"
            exit 0
          fi
          git config user.name "nhyzcms-assemble-bot"
          git config user.email "noreply@github.com"
          git add app/src/main/java/com/nhyzcms/clubapp/shell/feel/FeelHost.kt
          git commit -m "fix(区块 6)：clearPoll 自引用导致 Kotlin 类型推断递归（CI 报错），改为显式类型的局部引用"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Report failure as issue
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tail -c 2500 /tmp/assemble.log > /tmp/tail.txt 2>/dev/null || true
          gh issue create \
            --title "[区块6] 临时补丁应用失败（需人工介入）" \
            --body "$(cat /tmp/tail.txt 2>/dev/null)" || true
