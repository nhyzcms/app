# 临时通道（ROADMAP / ARCHITECTURE）：应用补丁到两个设计文档并提交。
#
# 背景：两个文件均超过仓库写入通道的单次载荷上限（8.7k / 8.0k 字符），故拆成补丁 + 一次性工作流。
# ⚠️ 本文件与 .github/parts/{rm,ar}-*.patch 都是**临时**的，落地后删除。
# 顺序要紧：先 docs/ROADMAP.md（rm-1），再 docs/ARCHITECTURE.md（ar-1、ar-2）。
name: temp-assemble-design-docs

on:
  push:
    paths:
      - '.github/parts/**'
      - '.github/workflows/temp-assemble-design-docs.yml'

permissions:
  contents: write
  issues: write

jobs:
  assemble:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: 检查补丁是否存在
        id: parts
        shell: bash
        run: |
          if [ -f .github/parts/ar-2.patch ] && [ -f .github/parts/rm-1.patch ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "补丁已清理，跳过"
          fi

      - name: Apply patches
        if: steps.parts.outputs.present == 'true'
        shell: bash
        run: |
          set -uo pipefail
          exec > >(tee /tmp/assemble.log) 2>&1
          for p in rm-1 ar-1 ar-2; do
            patch_file=".github/parts/$p.patch"
            echo "::group::apply $patch_file"
            if git apply --check "$patch_file" 2>/dev/null; then
              git apply "$patch_file" && echo "applied $patch_file"
            elif git apply --reverse --check "$patch_file" 2>/dev/null; then
              echo "$patch_file 已经应用过，跳过（幂等）"
            else
              echo "$patch_file 无法应用（目标文件与预期不一致）"
              exit 1
            fi
            echo "::endgroup::"
          done

      - name: Verify sha256
        if: steps.parts.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          echo "bdaf49988e2c41cea9c668bdf17693bccce5e135567f7ca8d332acba699085d9  docs/ROADMAP.md" | sha256sum -c -
          echo "354eb5c1f00a91ad78cdd87b0f3dbce429ec2f711d2459e6d1b107a6aaa4b1f6  docs/ARCHITECTURE.md" | sha256sum -c -

      - name: Commit and push
        if: steps.parts.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "没有变化，无需提交"
            exit 0
          fi
          git config user.name "nhyzcms-assemble-bot"
          git config user.email "noreply@github.com"
          git add docs/ROADMAP.md docs/ARCHITECTURE.md
          git commit -m "docs(区块 6)：改写 ROADMAP（区块 5/6 状态与实测数据）与 ARCHITECTURE（ADR A11~A15、组件职责、站点约束、6.6 流程）"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Report failure as issue
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tail -c 2500 /tmp/assemble.log > /tmp/tail.txt 2>/dev/null || true
          gh issue create \
            --title "[设计文档] 临时补丁应用失败（需人工介入）" \
            --body "$(cat /tmp/tail.txt 2>/dev/null)" || true
