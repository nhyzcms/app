# 临时通道（README）：把 readme-1/2.patch 应用到 README.md 并提交。
#
# 背景：README.md 约 13k 字符，超过仓库写入通道的单次载荷上限，故用补丁 + 一次性工作流。
# ⚠️ 本文件与 .github/parts/readme-*.patch 都是**临时**的，落地后删除。
name: temp-assemble-readme

on:
  push:
    paths:
      - '.github/parts/**'
      - '.github/workflows/temp-assemble-readme.yml'

permissions:
  contents: write
  issues: write

jobs:
  assemble:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: 检查补丁是否存在
        id: parts
        shell: bash
        run: |
          if [ -f .github/parts/readme-2.patch ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "补丁已清理，跳过"
          fi

      - name: Apply patches
        if: steps.parts.outputs.present == 'true'
        shell: bash
        run: |
          set -uo pipefail
          exec > >(tee /tmp/assemble.log) 2>&1
          for p in readme-1 readme-2; do
            patch_file=".github/parts/$p.patch"
            echo "::group::apply $patch_file"
            if git apply --check "$patch_file" 2>/dev/null; then
              git apply "$patch_file" && echo "applied $patch_file"
            elif git apply --reverse --check "$patch_file" 2>/dev/null; then
              echo "$patch_file 已经应用过，跳过（幂等）"
            else
              echo "$patch_file 无法应用（目标文件与预期不一致）"
              exit 1
            fi
            echo "::endgroup::"
          done

      - name: Verify sha256
        if: steps.parts.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          echo "5142abccd7cb4d75ac5750d9516dd70f9f78cdd1fffa042a060fe08b5704d3ba  README.md" | sha256sum -c -

      - name: Commit and push
        if: steps.parts.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "没有变化，无需提交"
            exit 0
          fi
          git config user.name "nhyzcms-assemble-bot"
          git config user.email "noreply@github.com"
          git add README.md
          git commit -m "docs(README)：补区块 5/6（目录结构、预检入口、权限清单 6 个、资源拦截红线、状态表、文档索引）"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Report failure as issue
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tail -c 2500 /tmp/assemble.log > /tmp/tail.txt 2>/dev/null || true
          gh issue create \
            --title "[README] 临时补丁应用失败（需人工介入）" \
            --body "$(cat /tmp/tail.txt 2>/dev/null)" || true
