# ─────────────────────────────────────────────────────────────────────────────
# 区块 3：L1 远程清单 + L2 更新包分发的 nginx 片段
#
# 为什么单独走一个 location：
#   * 不经 Django / gunicorn（静态文件，服务器负载为 0）；
#   * 与发布包解压目录分离（更新器不会覆盖它）；
#   * 不能放 /app/ 或 /media/：/app/... 会被 SPA 兜底路由吞掉（返回 index.html 200），
#     /media/ 是用户上传目录（7 天缓存 + 语义不清）。
#
# 用法（需要服务器管理员执行，见 docs/chunks/CHUNK-03-REPORT.md §5）：
#   把下面这段粘贴进 /etc/nginx/conf.d/club.conf 的 server { } 块内，
#   先备份原文件，再 `nginx -t` 通过后 `nginx -s reload`。
# ─────────────────────────────────────────────────────────────────────────────

location /app-update/ {
    alias /opt/club/app-update/;
    autoindex off;

    # 配置必须即时生效：绝不能长缓存
    add_header Cache-Control "no-cache" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    types {
        application/json json;
        application/vnd.android.package-archive apk;
    }
    default_type application/octet-stream;

    # 只允许读：任何写方法一律拒绝（这个目录由管理员手工维护）
    limit_except GET HEAD {
        deny all;
    }
}
