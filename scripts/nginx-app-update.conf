# ─────────────────────────────────────────────────────────────────────────────
# 区块 3：L1 远程清单 + L2 更新包分发的 nginx 片段
#
# 为什么单独走一个 location：
#   * 不经 Django / gunicorn（静态文件，服务器负载为 0）；
#   * 与发布包解压目录分离（更新器不会覆盖它）；
#   * 不能放 /app/ 或 /media/：/app/... 会被 SPA 兜底路由吞掉（返回 index.html 200），
#     /media/ 是用户上传目录（7 天缓存 + 语义不清）。
#
# 用法：
#   ① 先备份：cp -a /etc/nginx/conf.d/club.conf /etc/nginx/conf.d/club.conf.bak.app-update-$(date +%Y%m%d-%H%M%S)
#   ② 把下面这段粘进 club.conf 的 **HTTPS server { }** 块内（放在 location / { 之前）
#   ③ nginx -t 通过后 nginx -s reload
#   ④ curl -sSI https://<站点>/app-update/manifest.json   （期望 200 + application/json）
#
# ⚠️ 三个易踩点：
#   1. **目录必须在 `/opt/club/data/` 下面**（`data` 在网站更新器的 SYNC_EXCLUDES 里）。
#      更新器应用发布包是 rsync `--delete` 语义，/opt/club 下的非排除顶层目录会被删掉：
#      2026-10-17 00:42 的自动更新就把原来的 `/opt/club/app-update/` 删了（端点立刻 404）。
#   2. 权限要让 nginx worker 用户读得到：目录 0755 + 文件 0644（或 root:<nginx 用户> 0750/0640）。
#      `grep ^user /etc/nginx/nginx.conf` 查 worker 用户：本机是 nginx；有些发行版是 www-data。
#      install 出来的文件默认属主是 root:root，配 0640 会 403。
#   3. location 里一旦用了 add_header，就不再继承 server 级的 add_header，
#      所以 HSTS / Alt-Svc 必须在这里重复声明（见下方）。
#
# 本片段与线上实际生效的一致（2026-10-17 迁移到 data 根后的版本）。
# ─────────────────────────────────────────────────────────────────────────────

location /app-update/ {
    alias /opt/club/data/app-update/;
    autoindex off;

    # 配置必须即时生效：绝不能长缓存
    add_header Cache-Control "no-cache" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Alt-Svc 'h3=":443"; ma=86400' always;

    types {
        application/json json;
        application/vnd.android.package-archive apk;
    }
    default_type application/octet-stream;

    # 只允许读：任何写方法一律拒绝（这个目录由管理员手工维护）
    limit_except GET HEAD {
        deny all;
    }
}
